<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SavingDuit — Catatan Keuangan</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#161b22">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-icon">💰</span>
      <div>
        <strong>SavingDuit</strong>
        <small>Catatan Keuangan</small>
      </div>
    </div>

    <nav class="nav" id="nav">
      <a href="#/dashboard" data-view="dashboard"><span class="ic">📊</span> Dashboard</a>
      <a href="#/transaksi" data-view="transaksi"><span class="ic">📝</span> Transaksi</a>
      <a href="#/rekap"     data-view="rekap"><span class="ic">📅</span> Rekap</a>
      <a href="#/anggaran"  data-view="anggaran"><span class="ic">🎯</span> Anggaran</a>
      <a href="#/target"    data-view="target"><span class="ic">🏆</span> Target Tabungan</a>
      <a href="#/langganan" data-view="langganan"><span class="ic">🔁</span> Langganan</a>
      <a href="#/dompet"    data-view="dompet"><span class="ic">🏦</span> Dompet &amp; Bank</a>
      <a href="#/kategori"  data-view="kategori"><span class="ic">🏷️</span> Kategori</a>
      <a href="#/pengaturan" data-view="pengaturan"><span class="ic">⚙️</span> Pengaturan</a>
      <a href="#/profil" data-view="profil"><span class="ic">👤</span> Profil</a>
    </nav>

    <div class="sidebar-foot">
      <button class="profil-btn" id="btn-profil" onclick="App.go('profil')">
        <span class="pb-ic" id="pb-ic">🏠</span>
        <span class="pb-nama" id="pb-nama">Pribadi</span>
        <span class="pb-chev">›</span>
      </button>
      <button class="btn sm ghost full" id="btn-kunci" hidden onclick="V.profilKunci()">🔒 Kunci</button>
      <div class="net-dot" id="net-dot"><span></span><em>Lokal</em></div>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <main class="main">
    <header class="topbar">
      <button class="hamburger" id="hamburger" aria-label="Menu">☰</button>
      <h1 id="page-title">Dashboard</h1>
      <div class="topbar-actions">
        <button class="btn sm" id="btn-sync-cloud" onclick="App.manualSyncCloud()" title="Sinkronkan Cloudflare" style="display:inline-flex;align-items:center;gap:4px;padding:4px 9px;font-size:12px;">
          <span>🔄</span> <span class="sync-lbl">Sync</span>
        </button>
        <span class="total-pill" id="total-pill">Rp 0</span>
      </div>
    </header>

    <div class="content" id="content"></div>
  </main>
  <!-- ============ BOTTOM NAV (NATIVE APP STYLE) ============ -->
  <nav class="bottom-nav" id="bottom-nav">
    <a href="#/dashboard" class="bnav-item" data-bview="dashboard">
      <span class="bnav-ic">📊</span>
      <span class="bnav-lbl">Beranda</span>
    </a>
    <a href="#/transaksi" class="bnav-item" data-bview="transaksi">
      <span class="bnav-ic">📝</span>
      <span class="bnav-lbl">Transaksi</span>
    </a>
    <button class="bnav-fab" onclick="V.txForm()" aria-label="Tambah Transaksi">
      <span>➕</span>
    </button>
    <a href="#/rekap" class="bnav-item" data-bview="rekap">
      <span class="bnav-ic">📅</span>
      <span class="bnav-lbl">Rekap</span>
    </a>
    <a href="#/pengaturan" class="bnav-item" data-bview="pengaturan">
      <span class="bnav-ic">⚙️</span>
      <span class="bnav-lbl">Menu</span>
    </a>
  </nav>
</div>

<div class="scrim" id="scrim"></div>

<!-- ============ MODAL ============ -->
<div class="modal-wrap" id="modal-wrap" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <header class="modal-head">
      <h2 id="modal-title"></h2>
      <button class="x" data-close aria-label="Tutup">✕</button>
    </header>
    <div class="modal-body" id="modal-body"></div>
    <footer class="modal-foot" id="modal-foot"></footer>
  </div>
</div>

<!-- ============ TOAST ============ -->
<div class="toasts" id="toasts"></div>

<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/gdrive.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function (e) {
        console.warn('SW register gagal:', e);
      });
    });
  }
</script>
</body>
</html>
