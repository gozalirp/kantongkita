name: Build Android TWA (KantongKita)
on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release:
        description: 'Build signed release APK + AAB (requires signing secrets)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build debug APK (separate app ID; not domain-verified)
        if: ${{ !inputs.release }}
        working-directory: android-twa
        run: gradle --no-daemon :app:assembleDebug
      - name: Build signed release
        if: ${{ inputs.release }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/kantongkita-release.jks
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        working-directory: android-twa
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
          gradle --no-daemon :app:assembleRelease :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: KantongKita-TWA-${{ inputs.release && 'release' || 'debug' }}
          path: |
            android-twa/app/build/outputs/apk/**/*.apk
            android-twa/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
