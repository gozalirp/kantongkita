name: Build Android APK (SavingDuit)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor CLI
        run: |
          npm install --save @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Capacitor Config Pointing to Live Cloudflare
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.savingduit.app",
            "appName": "SavingDuit",
            "webDir": "www",
            "server": {
              "url": "https://savingduit.gozalirp.workers.dev",
              "cleartext": false,
              "androidScheme": "https"
            }
          }
          EOF
          mkdir -p www
          cp index.html www/

      - name: Initialize Android Platform
        run: |
          npx cap add android

      - name: Copy Icons to Android Res
        run: |
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          cp icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SavingDuit-App
          path: android/app/build/outputs/apk/debug/*.apk
