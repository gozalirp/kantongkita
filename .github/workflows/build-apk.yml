name: Build Android APK (SavingDuit)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Install Capacitor & Dependencies
        run: |
          npm init -y
          npm install --save @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Capacitor Config
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.savingduit.app",
            "appName": "SavingDuit",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

      - name: Prepare Web Directory (www)
        run: |
          mkdir -p www
          cp -r index.html css js manifest.json sw.js icon-192.png icon-512.png www/

      - name: Initialize Android Platform
        run: |
          npx cap add android

      - name: Copy Icons to Android Res
        run: |
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          cp icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SavingDuit-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
