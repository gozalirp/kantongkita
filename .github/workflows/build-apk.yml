name: Build Android APK (SavingDuit)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          npm install --save @capacitor/core @capacitor/cli @capacitor/android

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          cp -r index.html manifest.json sw.js css js icon-*.png www/

      - name: Create Capacitor Config
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.savingduit.app",
            "appName": "SavingDuit",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

      - name: Initialize Android Platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SavingDuit-App
          path: android/app/build/outputs/apk/debug/*.apk
