name: Build native Android preview
on:
  push:
    branches: [main, master]
    paths:
      - 'android-native/**'
      - '.github/workflows/build-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test, lint and build native preview (not a release APK)
        working-directory: android-native
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: KantongKita-native-preview-debug
          path: android-native/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
