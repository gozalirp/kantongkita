name = "savingduit"
main = "worker/worker.js"
compatibility_date = "2024-01-01"
workers_dev = true
routes = [{ pattern = "moneyplanner.darmintompel.my.id", custom_domain = true }]

# ==================== FRONTEND ====================
# Hanya folder public/ yang di-upload sebagai asset statis.
[assets]
directory = "public"

[vars]
# Mengaktifkan akun keluarga. Setel "false" untuk menonaktifkan tanpa mengubah kode.
FAMILY_ENABLED = "true"
APP_ORIGIN = "https://moneyplanner.darmintompel.my.id"
EMAIL_FROM = "KantongKita <akun@mail.darmintompel.my.id>"
# RESEND_API_KEY must be stored using wrangler secret put, never committed.

# ==================== BACKEND ====================
# Binding database D1 untuk API /api/sync
[[d1_databases]]
binding = "DB"
database_name = "savingduit-db"
database_id = "5b96f65a-d387-4565-9d39-a2a17f3f8866"

# Daily bounded cleanup of expired auth records; never financial data.
[triggers]
crons = ["17 20 * * *"]
