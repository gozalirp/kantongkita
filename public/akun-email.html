<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Pemulihan akun, Money Planner</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head>
<body class="wajib-masuk"><main class="gerbang" style="max-width:440px;margin:40px auto;padding:16px"><section class="card gerbang-kartu"><h1 id="email-title">Lupa password?</h1><p id="email-hint">Masukkan email yang sudah diverifikasi untuk menerima tautan reset.</p><form id="email-form"><div class="field" id="email-field"><label for="email-address">Email</label><input id="email-address" type="email" autocomplete="email" maxlength="254" required></div><div class="field" id="recovery-field" hidden style="display:none"><label for="recovery-user">Username</label><input id="recovery-user" autocomplete="username" maxlength="32"><label for="recovery-code">Kode pemulihan</label><input id="recovery-code" autocomplete="off" maxlength="128"></div><div class="field" id="password-field" hidden style="display:none"><label for="email-password">Password baru</label><input id="email-password" type="password" autocomplete="new-password" minlength="12" maxlength="128"></div><button class="btn primary" type="submit" id="email-submit" style="min-height:44px">Kirim tautan reset</button></form><p id="email-message" role="status" aria-live="polite"></p><p><a href="/">Kembali ke Masuk</a></p><p><a href="/akun-email#recover">Gunakan kode pemulihan</a></p></section></main><script src="/js/akun-email.js"></script></body></html>
