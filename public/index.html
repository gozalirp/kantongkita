<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SavingDuit — Catatan Keuangan</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F4F5FC">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-icon">💰</span>
      <div>
        <strong>SavingDuit</strong>
        <small>Catatan Keuangan</small>
      </div>
    </div>

    <nav class="nav" id="nav" aria-label="Navigasi utama">
      <a href="#/dashboard" data-view="dashboard"><span class="ic"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z"/></svg></span> Dashboard</a>
      <a href="#/transaksi" data-view="transaksi"><span class="ic"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5v18h14V3h-3 M9 3h6v4H9z M8 12h8 M8 16h5"/></svg></span> Transaksi</a>
      <a href="#/rekap"     data-view="rekap"><span class="ic"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v16H4z M8 3v4 M16 3v4 M4 10h16 M8 14h2 M14 14h2 M8 18h2"/></svg></span> Rekap</a>
      <a href="#/anggaran"  data-view="anggaran"><span class="ic"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9 M17 12a5 5 0 1 1-5-5 M12 12l9-9 M16 3h5v5"/></svg></span> Anggaran</a>
      <a href="#/target"    data-view="target"><span class="ic"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3h8v5a4 4 0 0 1-8 0z M8 5H4v2a4 4 0 0 0 4 4 M16 5h4v2a4 4 0 0 1-4 4 M12 12v6 M8 21h8 M9 18h6"/></svg></span> Target Tabungan</a>
      <a href="#/langganan" data-view="langganan"><span class="ic"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9a8 8 0 0 1 13-5l3 3 M20 3v4h-4 M20 15a8 8 0 0 1-13 5l-3-3 M4 21v-4h4"/></svg></span> Langganan</a>
      <a href="#/dompet"    data-view="dompet"><span class="ic"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h17v15H3z M3 6l13-3v3 M15 11h6v5h-6z"/></svg></span> Dompet &amp; Bank</a>
      <a href="#/kategori"  data-view="kategori"><span class="ic"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3h8l10 10-8 8L3 11z M7 7h.01"/></svg></span> Kategori</a>
      <a href="#/pengaturan" data-view="pengaturan"><span class="ic"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8 M9 3h6l1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1z"/></svg></span> Pengaturan</a>
      <a href="#/profil" data-view="profil"><span class="ic"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8 M4 21v-2a8 8 0 0 1 16 0v2"/></svg></span> Profil</a>
    </nav>

    <div class="sidebar-foot">
      <button class="profil-btn" id="btn-profil" onclick="App.go('profil')">
        <span class="pb-ic" id="pb-ic">🏠</span>
        <span class="pb-nama" id="pb-nama">Pribadi</span>
        <span class="pb-chev">›</span>
      </button>
      <button class="btn sm ghost full" id="btn-kunci" hidden onclick="V.profilKunci()">🔒 Kunci</button>
      <div class="net-dot" id="net-dot"><span></span><em>Lokal</em></div>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <main class="main">
    <header class="topbar">
      <button class="hamburger" id="hamburger" aria-label="Menu">☰</button>
      <h1 id="page-title">Dashboard</h1>
      <div class="topbar-actions">
        <button class="mode-pill" id="mode-pill" onclick="App.gantiMode()" title="Catatan pribadi di perangkat ini">👤 Pribadi</button>
        <button class="btn sm" id="btn-sync-cloud" onclick="App.manualSyncCloud()" title="Sinkronkan Cloudflare" style="display:inline-flex;align-items:center;gap:4px;padding:4px 9px;font-size:12px;">
          <span>🔄</span> <span class="sync-lbl">Sync</span>
        </button>
        <span class="total-pill" id="total-pill">Rp 0</span>
      </div>
    </header>

    <div class="content" id="content"></div>
  </main>
  <!-- ============ BOTTOM NAV (NATIVE APP STYLE) ============ -->
  <nav class="bottom-nav" id="bottom-nav" aria-label="Navigasi ponsel">
    <a href="#/dashboard" class="bnav-item" data-bview="dashboard">
      <span class="bnav-ic"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z"/></svg></span>
      <span class="bnav-lbl">Beranda</span>
    </a>
    <a href="#/transaksi" class="bnav-item" data-bview="transaksi">
      <span class="bnav-ic"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5v18h14V3h-3 M9 3h6v4H9z M8 12h8 M8 16h5"/></svg></span>
      <span class="bnav-lbl">Transaksi</span>
    </a>
    <button class="bnav-fab" onclick="V.txForm()" aria-label="Tambah Transaksi">
      <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14 M5 12h14"/></svg>
    </button>
    <a href="#/rekap" class="bnav-item" data-bview="rekap">
      <span class="bnav-ic"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v16H4z M8 3v4 M16 3v4 M4 10h16 M8 14h2 M14 14h2 M8 18h2"/></svg></span>
      <span class="bnav-lbl">Rekap</span>
    </a>
    <a href="#/menu" class="bnav-item" data-bview="menu">
      <span class="bnav-ic"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16 M4 12h16 M4 18h16"/></svg></span>
      <span class="bnav-lbl">Menu</span>
    </a>
  </nav>
</div>

<div class="scrim" id="scrim"></div>

<!-- ============ MODAL ============ -->
<div class="modal-wrap" id="modal-wrap" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <header class="modal-head">
      <h2 id="modal-title"></h2>
      <button class="x" data-close aria-label="Tutup">✕</button>
    </header>
    <div class="modal-body" id="modal-body"></div>
    <footer class="modal-foot" id="modal-foot"></footer>
  </div>
</div>

<!-- ============ TOAST ============ -->
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/gdrive.js"></script>
<script src="js/keluarga-mode.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function (e) {
        console.warn('SW register gagal:', e);
      });
    });
  }
</script>
</body>
</html>
